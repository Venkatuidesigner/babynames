<header class="site-header">
  <nav class="site-nav">
    <span class="nav-pill">குழந்தை ரூட்ஸ்</span>
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        {{ ui.language === 'ta' ? 'முகப்பு' : 'Home' }}
      </a>
      <a routerLink="/names" routerLinkActive="active" class="nav-link">
        {{ ui.language === 'ta' ? 'பெயர்கள்' : 'Explore Names' }}
      </a>
      <a routerLink="/add-name" routerLinkActive="active" class="nav-link">
        {{ ui.language === 'ta' ? 'பெயர் சேர்' : 'Add Name' }}
      </a>
    </div>
    <div class="nav-actions">
      <div class="language-toggle" aria-label="Language selector">
        <button class="pill" [class.active]="ui.language === 'ta'" type="button" (click)="ui.setLanguage('ta')">
          தமிழ்
        </button>
        <button class="pill" [class.active]="ui.language === 'en'" type="button" (click)="ui.setLanguage('en')">
          English
        </button>
      </div>
      <div class="theme-toggle">
        <!-- <label class="theme-label" for="theme-select">
          {{ ui.language === 'ta' ? 'தீம்' : 'Theme' }}
        </label> -->
        <select
          id="theme-select"
          class="theme-select"
          [ngModel]="ui.theme"
          (ngModelChange)="ui.setTheme($event)"
          aria-label="Theme selector"
        >
          <option *ngFor="let option of themeOptions" [ngValue]="option.value">
            {{ getThemeLabel(option) }}
          </option>
        </select>
      </div>
    </div>
  </nav>
</header>
