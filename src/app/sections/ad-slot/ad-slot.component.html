<div class="ad-slot" [attr.aria-label]="ui.language === 'ta' ? 'விளம்பரம்' : 'Advertisement'">
  <p class="label">{{ ui.language === 'ta' && label === 'Advertisement' ? 'விளம்பரம்' : label }}</p>
  <div class="ad-box">
    <p>{{ ui.language === 'ta' ? 'AdSense விளம்பர இடம்' : 'AdSense ad placement' }}</p>
    <p class="hint">{{ ui.language === 'ta' ? '(லைவ் விளம்பர அலகாக மாற்றவும்)' : '(replace with a live ad unit)' }}</p>
  </div>
  <!-- Example AdSense unit. Replace data-ad-client/slot in production.
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-XXXXXXXXXXXXXXX"
       data-ad-slot="{{ slot }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  -->
</div>
