<section class="section">
  <div class="section-header">
    <h2>Browse by category</h2>
    <p>Quick entry points for popular Tamil baby name themes.</p>
  </div>
  <div class="grid">
    <article *ngFor="let item of categories" class="card">
      <div class="icon">{{ item.icon }}</div>
      <h3>{{ item.title }}</h3>
      <p>{{ item.description }}</p>
      <a [routerLink]="['/names']" [queryParams]="{ category: item.slug }">Explore {{ item.title.toLowerCase() }}</a>
    </article>
  </div>
</section>
