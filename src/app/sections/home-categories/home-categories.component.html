<section class="section">
  <div class="section-header">
    <h2>வகைப்படி பார்க்க</h2>
    <p>பிரபலமான தமிழ் குழந்தை பெயர் வகைகளுக்கான விரைவு வழிகள்.</p>
  </div>
  <div class="grid">
    <article *ngFor="let item of categories" class="card">
      <div class="icon">{{ item.icon }}</div>
      <h3>{{ item.title }}</h3>
      <p>{{ item.description }}</p>
      <a [routerLink]="['/names']" [queryParams]="{ category: item.slug }">{{ item.title }} மேலும் காண்க</a>
    </article>
  </div>
</section>
