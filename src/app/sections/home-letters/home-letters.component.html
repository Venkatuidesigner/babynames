<section id="browse-letters" class="section">
  <div class="section-header">
    <h2>தமிழ் எழுத்து படி பார்க்க</h2>
    <p>/names/a, /names/ka போன்ற எழுத்துப் பக்கங்களுக்கு நேரடியாக செல்லுங்கள்.</p>
  </div>
  <div class="letters">
    <a *ngFor="let letter of letters" [routerLink]="['/names', letter.slug]" class="letter-card">
      <span class="tamil">{{ letter.tamil }}</span>
    </a>
  </div>
</section>
