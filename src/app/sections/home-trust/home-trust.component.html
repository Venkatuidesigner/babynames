<section class="section">
  <div class="section-header">
    <h2>ஏன் குடும்பங்கள் நம்புகின்றன</h2>
    <p>தரமும் நம்பகத்தன்மையும் முன்னிலைப்படுத்தப்படுகின்றன.</p>
  </div>
  <div class="grid">
    <div *ngFor="let item of items" class="card">
      <div class="badge">சரிபார்க்கப்பட்டது</div>
      <h3>{{ item.title }}</h3>
      <p>{{ item.detail }}</p>
    </div>
  </div>
</section>
