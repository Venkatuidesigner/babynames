<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tamil Baby Names with Meaning</title>
  <desc id="desc">Social preview image for Tamil Baby Names.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.45" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#831843" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="130" fill="#fda4af" opacity="0.45"/>
  <circle cx="130" cy="510" r="150" fill="#7dd3fc" opacity="0.45"/>
  <g filter="url(#shadow)">
    <rect x="100" y="95" width="1000" height="440" rx="32" fill="#ffffff" opacity="0.92"/>
  </g>
  <text x="150" y="190" fill="#be123c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Tamil Baby Names</text>
  <text x="150" y="285" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">Meaningful names</text>
  <text x="150" y="365" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">with Tamil roots</text>
  <text x="150" y="445" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="32">Browse boy and girl names by letter, meaning, and culture.</text>
  <g transform="translate(840 250)">
    <circle cx="85" cy="85" r="85" fill="url(#accent)"/>
    <text x="85" y="106" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800">அ</text>
  </g>
</svg>
